services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testpilot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    environment:
      - ENVIRONMENT=development
      - DATABASE_PATH=data/testpilot.db
      # LLM Provider: "mock" (default) veya "gemini"
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      # Gemini: .env dosyasından okunur veya buraya direkt yazılır
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - LLM_FALLBACK_TO_MOCK=${LLM_FALLBACK_TO_MOCK:-true}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testpilot-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
