services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    environment:
      - ENVIRONMENT=development
      - DATABASE_PATH=data/testpilot.db
      - DEMO_RESET_ON_STARTUP=${DEMO_RESET_ON_STARTUP:-true}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testpilot-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
