name: testpilot_mobile
description: TestPilot mobile foundation built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.3+1
  http: ^1.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/testpilot_launcher.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/testpilot_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/testpilot_launcher.png"
  remove_alpha_ios: true
